<script>
(()=>{'use strict';

const T=THREE,V=T.Vector3,R=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const _v=new V(),_a=new V(),_b=new V(),_m=new V(),_q=new T.Quaternion();

/* sky + presets */
const NOISE_GLSL = `
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y);}
float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*noise(p);p*=2.03;a*=0.5;}return s;}
`;

const skyMat = new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uTop: { value: new T.Color() },
    uHor: { value: new T.Color() },
    uSun: { value: new V(0, 1, 0) },
    uSunCol: { value: new T.Color() },
    uCloud: { value: new T.Color() },
    uStars: { value: 0 },
    uTime: { value: 0 }
  },
  vertexShader: `varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `
  uniform vec3 uTop,uHor,uSun,uSunCol,uCloud;uniform float uStars,uTime;varying vec3 vD;
  ${NOISE_GLSL}
  float hash3(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
  void main(){
    vec3 d=normalize(vD);
    float h=max(d.y,0.0);
    vec3 col=mix(uHor,uTop,pow(h,0.55));
    float sd=max(dot(d,uSun),0.0);
    col+=uSunCol*(pow(sd,900.0)*6.0+pow(sd,60.0)*0.6+pow(sd,6.0)*0.18);
    col+=uSunCol*0.25*pow(sd,3.0)*(1.0-h)*(1.0-h);
    if(d.y>0.0){
      vec2 uv=d.xz/(d.y+0.12)*0.55+vec2(uTime*0.004,0.0);
      float c=fbm(uv*2.2);
      c=smoothstep(0.5,0.82,c)*smoothstep(0.0,0.18,d.y);
      col=mix(col,uCloud*(0.8+0.2*sd),c*0.7);
      
      vec3 sd3=d*450.0;
      float starRnd=hash3(floor(sd3));
      vec3 starF=fract(sd3)-0.5;
      float starCore=smoothstep(0.35,0.0,length(starF));
      float s=step(0.9982,starRnd)*starCore;
      float twinkle=0.8+0.2*sin(starRnd*80.0+uTime*4.0);
      col+=vec3(s)*uStars*twinkle*smoothstep(0.04,0.28,d.y)*(1.0-c);
    }
    gl_FragColor=vec4(col,1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`
});
const sky = new T.Mesh(new T.SphereGeometry(2200, 32, 16), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10; scene.add(sky);

const PRE = {
  day: {
    sunDir: new V(0.55, 0.55, 0.62).normalize(),
    sunCol: new T.Color(1, 0.94, 0.82),
    sunInt: 2.3,
    hSky: new T.Color(0.62, 0.75, 0.95),
    hGnd: new T.Color(0.2, 0.25, 0.3),
    hInt: 0.85,
    top: new T.Color(0.12, 0.34, 0.72),
    hor: new T.Color(0.62, 0.78, 0.92),
    cloud: new T.Color(1, 1, 1),
    stars: 0,
    deep: new T.Color(0.012, 0.085, 0.16),

    lum: 1,

  },
  dusk: {

    hSky: new T.Color(0.55, 0.42, 0.5),
    hGnd: new T.Color(0.18, 0.14, 0.16),

    top: new T.Color(0.08, 0.12, 0.32),
    hor: new T.Color(0.95, 0.5, 0.28),
    cloud: new T.Color(0.95, 0.5, 0.42),
    stars: 0.15,

    hor: new T.Color(0.03, 0.05, 0.08),

  hGnd: new T.Color(0.2, 0.25, 0.3),
  hInt: 0.85,
  top: new T.Color(0.12, 0.34, 0.72),
  hor: new T.Color(0.62, 0.78, 0.92),
  cloud: new T.Color(1, 1, 1),
  stars: 0,

let tgt = PRE.day, tName = 'Day';

/* water + wave model */
const WAVE_GLSL = `
float wave(vec2 p,vec2 d,float k,float a,float w,float t,inout vec2 g){
  float ph=dot(p,d)*k-w*t;
  g+=d*(k*a*cos(ph));
  return a*sin(ph);
}
float height(vec2 p,float t,float amp,out vec2 g){
  g=vec2(0.0);float h=0.0;
  h+=wave(p,vec2(0.80,0.60),0.22,0.40,1.47,t,g);
  h+=wave(p,vec2(-0.50,0.87),0.35,0.24,1.85,t,g);
  h+=wave(p,vec2(0.95,-0.31),0.52,0.13,2.26,t,g);
  h+=wave(p,vec2(-0.20,-0.98),0.90,0.055,2.97,t,g);
  g*=amp;return h*amp;
}
`;
const WV=[[.8,.6,.22,.40,1.47],[-.5,.87,.35,.24,1.85],[.95,-.31,.52,.13,2.26],[-.2,-.98,.9,.055,2.97]];
function waveH(x,z){
  const px=x+shipDist;let h=0;
  for(const w of WV)h+=w[3]*Math.sin((px*w[0]+z*w[1])*w[2]-w[4]*time);
  return h*sea;
}

const waterMat=new T.ShaderMaterial({
  fog:false,
  uniforms:{
    uTime:{value:0},uShip:{value:0},uAmp:{value:1},uSpeedN:{value:.6},uLum:{value:1},
    uDeep:{value:new T.Color()},uShal:{value:new T.Color()},uHor:{value:new T.Color()},uTop:{value:new T.Color()},
    uSun:{value:new V(0,1,0)},uSunCol:{value:new T.Color()}
  },
  vertexShader:`
  uniform float uTime,uShip,uAmp;
  varying vec3 vW;varying vec2 vG;varying float vH;varying vec2 vP;
  ${WAVE_GLSL}
  void main(){
    vec4 w=modelMatrix*vec4(position,1.0);
    vec2 p=vec2(w.x+uShip,w.z);
    vec2 g;float h=height(p,uTime,uAmp,g);
    vP=vec2(w.x,w.z);vG=g;vH=h;w.y+=h;vW=w.xyz;
    gl_Position=projectionMatrix*viewMatrix*w;
  }`,
  fragmentShader:`
  uniform float uTime,uShip,uAmp,uSpeedN,uLum;
  uniform vec3 uDeep,uShal,uHor,uTop,uSun,uSunCol;
  varying vec3 vW;varying vec2 vG;varying float vH;varying vec2 vP;
  ${NOISE_GLSL}
  vec3 skyCol(vec3 r){
    float sd=max(dot(r,uSun),0.0);
    vec3 c=mix(uHor,uTop,pow(clamp(r.y,0.0,1.0),0.55));
    c+=uSunCol*(pow(sd,120.0)*0.8+pow(sd,16.0)*0.2*uLum);
    return c;
  }
  void main(){
    vec2 p=vec2(vP.x+uShip,vP.y);
    vec2 rip=vec2(noise(p*1.9+uTime*0.5)-0.5,noise(p*1.9+7.3-uTime*0.45)-0.5)*0.28
            +vec2(noise(p*5.0-uTime*0.8)-0.5,noise(p*5.0+3.1+uTime*0.7)-0.5)*0.12;
    vec3 n=normalize(vec3(-vG.x-rip.x,1.0,-vG.y-rip.y));
    vec3 V=normalize(cameraPosition-vW);
    float fres=0.03+0.97*pow(1.0-max(dot(n,V),0.0),5.0);
    vec3 R=reflect(-V,n);R.y=abs(R.y);
    vec3 refl=skyCol(R);
    float sd=max(dot(R,uSun),0.0);
    float spec=pow(sd,420.0)*3.0+pow(sd,40.0)*0.22*uLum;
    float k=clamp(vH/(1.2*uAmp+0.001)+0.5,0.0,1.0);
    vec3 base=mix(uDeep,uShal,k*0.65);
    float diff=max(dot(n,uSun),0.0);
    vec3 col=base*(0.7+0.5*diff);
    col=mix(col,refl,fres)+uSunCol*spec;

    // Carrier hull foam & Kelvin wake
    float xx = vP.x;
    float az = abs(vP.y);
    float inS = step(-62.0, xx) * step(xx, 64.0);
    float hb = (xx < 36.0) ? (13.0 + (xx + 60.0) * 0.013) : (14.2 * pow(max(64.0 - xx, 0.0) / 28.0, 0.8));
    float dd = az - hb;
    vec2 q = vec2(vP.x + uShip, vP.y);
    float fn = fbm(q * 1.2 + vec2(uTime * 0.15, 0.0));
    float fn2 = noise(q * 3.5 - uTime * 0.3);
    float hullF = (1.0 - smoothstep(0.0, 2.5 + fn * 1.5, dd)) * inS;
    float bowF = smoothstep(40.0, 64.0, xx) * (1.0 - smoothstep(0.0, 8.0, dd)) * inS;
    float xb = max(-xx - 60.0, 0.0);
    float inW = step(60.0, -xx);
    float wake = inW * (1.0 - smoothstep(0.0, 5.0 + xb * 0.18, az)) * exp(-xb * 0.009);
    float kel = inW * exp(-pow((az - (4.0 + xb * 0.35)) / (1.5 + xb * 0.04), 2.0)) * exp(-xb * 0.012) * 0.85;
    float foam = (hullF * 0.7 + bowF * 0.95 + wake + kel) * (0.25 + 0.75 * uSpeedN);
    float mask = mix(0.35, 1.0, smoothstep(0.3, 0.6, fn + 0.3 * fn2));
    foam = clamp(foam * 1.3, 0.0, 1.0) * mask;
    float cf = smoothstep(0.65, 0.98, vH / (0.825 * uAmp + 0.001)) * (0.4 + 0.6 * fn2) * 0.6 * smoothstep(0.15, 0.8, uLum);
    float foamTotal = clamp(foam * (0.2 + 0.8 * uLum) + cf, 0.0, 1.0);
    col = mix(col, vec3(0.92, 0.97, 1.0) * max(uLum, 0.04), foamTotal);

    float dist = length(cameraPosition - vW);
    col = mix(col, uHor, smoothstep(220.0, 750.0, dist));
    gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`
});
const water = new T.Mesh(new T.PlaneGeometry(1600, 1600, 400, 400).rotateX(-Math.PI / 2), waterMat);
water.frustumCulled = false; scene.add(water);

/* ================= carrier ================= */
const ship=new T.Group();scene.add(ship);const D=13.1;
const M=(c,r=.65,m=.25)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const mat={hull:M(0x56616a),red:M(0x6e2723),deck:M(0x474f55,.9,.05),gray:M(0x8a949b),light:M(0xa9b3b9),dark:M(0x23282d,.7,.4),glass:M(0x0d1a24,.15,.8),white:M(0xe6ebee,.6,.1)};
const win=new T.MeshStandardMaterial({color:0x10202c,emissive:0xffd27a,emissiveIntensity:0,roughness:.3});
function bx(w,h,d,m,x,y,z,p=ship){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o;}
function cy(rt,rb,h,m,x,y,z,p=ship){const o=new T.Mesh(new T.CylinderGeometry(rt,rb,h,12),m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o;}
function poly(pts,depth,y0,m){const s=new T.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],-p[1]):s.moveTo(p[0],-p[1]));
const o=new T.Mesh(new T.ExtrudeGeometry(s,{depth,bevelEnabled:false}).rotateX(-Math.PI/2),m);o.position.y=y0;o.castShadow=o.receiveShadow=true;ship.add(o);}
const hullP=[[-60,13],[-60,-13],[34,-14],[50,-7],[62,0],[50,7],[34,14]];
function hullLoft(){const N=56,Mj=16,P=[],Col=[],I=[],cR=new T.Color(0x6e2723),cG=new T.Color(0x56616a),cc=new T.Color();
const hb=x=>x<36?13+(x+60)*.0128:14.2*Math.pow(Math.max(64-x,0)/28,.8),kY=t=>-5*(1-Math.pow(t,5))+3*Math.pow(Math.max(.1-t,0)/.1,2);
for(let i=0;i<=N;i++){const t=i/N,x=-60+124*t,B=hb(x),k=kY(t);for(let j=0;j<=Mj;j++){const a=j/Mj*Math.PI,s=Math.sin(a),y=11.8-(11.8-k)*Math.pow(s,.75);P.push(x,y,B*Math.cos(a)*(1+.06*(1-s)));cc.copy(y<.4?cR:cG);Col.push(cc.r,cc.g,cc.b);}}
for(let i=0;i<N;i++)for(let j=0;j<Mj;j++){const a=i*(Mj+1)+j,b=a+Mj+1;I.push(a,a+1,b,a+1,b+1,b);}
const c0=P.length/3;P.push(-60,2,0);Col.push(cG.r,cG.g,cG.b);for(let j=0;j<Mj;j++)I.push(c0,j,j+1);
const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(P,3));g.setAttribute('color',new T.Float32BufferAttribute(Col,3));g.setIndex(I);g.computeVertexNormals();
const m=new T.Mesh(g,new T.MeshStandardMaterial({vertexColors:true,roughness:.65,metalness:.25,side:T.DoubleSide}));m.castShadow=m.receiveShadow=true;ship.add(m);}
hullLoft();
poly([[-62,15],[-62,-27],[-6,-27],[10,-16],[38,-15],[66,0],[38,15]],1.3,11.8,[mat.deck,mat.hull]);
